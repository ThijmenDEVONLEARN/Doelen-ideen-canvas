<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Doelen Canvas</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='8' fill='none' stroke='%238b6cf5' stroke-width='3'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <svg width="0" height="0" class="sprite" aria-hidden="true">
    <symbol id="i-select" viewBox="0 0 24 24"><path d="M5 3l14 8-6 2-2 6z"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20l1-4L16 5l3 3L8 19z"/><path d="M14 7l3 3"/></symbol>
    <symbol id="i-goal" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/></symbol>
    <symbol id="i-idea" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3" stroke-dasharray="3 3"/></symbol>
    <symbol id="i-note" viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6z"/><path d="M9 11h7M9 15h7"/></symbol>
    <symbol id="i-zone" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="4"/></symbol>
    <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 16l5-5 5 5 3-3 5 5"/></symbol>
    <symbol id="i-link" viewBox="0 0 24 24"><path d="M5 19C9 19 9 5 19 5"/><circle cx="5" cy="19" r="2"/><circle cx="19" cy="5" r="2"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4-4"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  </svg>

  <header class="topbar">
    <span class="logo"><i></i>Doelen Canvas</span>
    <span class="spacer"></span>
    <span class="save-status" id="save-status" role="status">opgeslagen</span>
    <button type="button" class="btn" id="search-open"><svg><use href="#i-search"/></svg>Zoeken <kbd>Ctrl K</kbd></button>
    <button type="button" class="btn" id="timeline-toggle" aria-pressed="false" title="Tijdband (T)"><span>Tijdband</span></button>
    <button type="button" class="btn" id="review-open">Weekreview</button>
  </header>

  <nav class="rail" role="toolbar" aria-label="Gereedschap">
    <button type="button" data-tool="select" title="Selecteren en verplaatsen (V)" aria-label="Selecteren"><svg><use href="#i-select"/></svg></button>
    <button type="button" data-tool="edit" title="Bewerken (P of E)" aria-label="Bewerken"><svg><use href="#i-edit"/></svg></button>
    <button type="button" data-tool="doel" title="Nieuw doel (D)" aria-label="Nieuw doel"><svg><use href="#i-goal"/></svg></button>
    <button type="button" data-tool="idee" title="Nieuw idee (I)" aria-label="Nieuw idee"><svg><use href="#i-idea"/></svg></button>
    <button type="button" data-tool="notitie" title="Nieuwe notitie (N)" aria-label="Nieuwe notitie"><svg><use href="#i-note"/></svg></button>
    <button type="button" data-tool="zone" title="Zone tekenen (Z)" aria-label="Zone tekenen"><svg><use href="#i-zone"/></svg></button>
    <button type="button" data-tool="afbeelding" title="Afbeelding toevoegen (A), of sleep of plak een afbeelding" aria-label="Afbeelding toevoegen"><svg><use href="#i-image"/></svg></button>
    <button type="button" data-tool="lijn" title="Verbinden (L)" aria-label="Verbinden"><svg><use href="#i-link"/></svg></button>
  </nav>

  <main id="viewport" class="viewport" aria-label="Canvas">
    <div id="world" class="world">
      <div id="zones"></div>
      <svg id="links" class="links"></svg>
      <div id="cards"></div>
    </div>
    <p id="empty-hint" class="empty-hint" hidden>Dubbelklik ergens om je eerste doel te maken.</p>
  </main>

  <div class="zoombar">
    <button type="button" id="zoom-out" aria-label="Uitzoomen">−</button>
    <span id="zoom-level">100%</span>
    <button type="button" id="zoom-in" aria-label="Inzoomen">+</button>
    <button type="button" id="zoom-fit">Passend</button>
  </div>

  <canvas id="minimap" class="minimap" aria-label="Overzichtskaart, klik om erheen te gaan"></canvas>
  <section id="timeline" class="timeline" aria-label="Tijdband" hidden></section>
  <aside id="panel" class="panel" hidden aria-live="polite"></aside>
  <div id="toast" class="toast" role="status" hidden></div>

  <style id="card-styles"></style>
  <script type="module" src="/js/main.js"></script>
</body>
</html>
